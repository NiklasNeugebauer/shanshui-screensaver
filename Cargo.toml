[package]
name = "shanshui"
version = "0.1.0"
edition = "2021"
description = "Procedurally generated infinite Chinese landscape scroll as a Wayland screensaver"
license = "MIT"

[dependencies]
tiny-skia = "0.11"
winit = { version = "0.30", default-features = false, features = ["wayland", "rwh_06"] }
softbuffer = { version = "0.4", default-features = false, features = ["wayland"] }
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
