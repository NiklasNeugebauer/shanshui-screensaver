[package]
name = "shanshui"
version = "0.1.0"
edition = "2021"
description = "Procedurally generated infinite Chinese landscape scroll as a Wayland screensaver"
license = "MIT AND LGPL-2.1-or-later"

[dependencies]
tiny-skia = "0.11"
winit = { version = "0.30", default-features = false, features = ["wayland", "rwh_06"] }
softbuffer = { version = "0.4", default-features = false, features = ["wayland"] }
clap = { version = "4", features = ["derive"] }
signal-hook = { version = "0.3", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
